<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Simples</title>
</head>
<body>

    <h1>Produtos da Loja Geek</h1>

    <table border="1">
        <tr>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Valor</th>
            <th>Imagem</th>
            <th>Ações</th>
        </tr>
        <tr>
            <td>Teclado</td>
            <td>Periferico</td>
            <td>R$ 250,00</td>
            <td>
                <img
                    src="https://m.media-amazon.com/images/I/616Lyy60cTL._AC_UF894,1000_QL80_.jpg" 
                    alt="Teclado"
                    width="100">
            </td>
            <td>
                <button>Editar</button>
                <button>Excluir</button>
            </td>
        </tr>
        <tr>
            <td>Mouse Gamer</td>
            <td>Periferico</td>
            <td>R$ 180,00</td>
            <td>
                <img
                    src="https://cdn.dooca.store/1841/products/invader-pro-wireless-preto-1.jpg?v=1724770690&webp=0" 
                    alt="Mouse"
                    width="100">
            </td>
            <td>
                <button>Editar</button>
                <button>Excluir</button>
            </td>
        </tr>
        <tr>
            <td>Funko Pop</td>
            <td>Colecionavel</td>
            <td>R$ 95,00</td>
            <td>
                <img
                    src="https://images.tcdn.com.br/img/img_prod/1002138/funko_pop_harry_potter_e_a_ordem_da_fenix_3257_1_07040616e30092a956332f3b35ccbcb6.jpg" 
                    alt="Boneco"
                    width="100">
            </td>
            <td>
                <button>Editar</button>
                <button>Excluir</button>
            </td>
        </tr>
    </table>
    
</body>
</html>
